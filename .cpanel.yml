---
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/lamoradadelviento.com/qr-eventos"
    - export PRIVATEDIR="$HOME/eventqr_private"
    - /bin/mkdir -p "$DEPLOYPATH" "$PRIVATEDIR"
    - /bin/cp -R public/. "$DEPLOYPATH/"
    - /bin/cp -R private/. "$PRIVATEDIR/"
    - /bin/chmod 700 "$PRIVATEDIR"
